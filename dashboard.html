<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitZone Dashboard</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

display:flex;

height:100vh;

background:#0f172a;

color:white;

}





.sidebar{

width:250px;

background:#111827;

padding:20px;

}





.logo{

font-size:30px;

font-weight:bold;

color:#22c55e;

text-align:center;

margin-bottom:30px;

}





.sidebar button{

width:100%;

padding:15px;

margin:6px 0;

border:none;

background:none;

color:white;

cursor:pointer;

font-size:16px;

text-align:left;

border-radius:10px;

}




.sidebar button:hover{

background:#22c55e;

}





.main{

flex:1;

padding:30px;

overflow:auto;

}





.page{

display:none;

}



#dashboard{

display:block;

}





.card{

background:#1e293b;

padding:20px;

border-radius:15px;

margin-top:20px;

}





.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:20px;

margin-top:20px;

}





.stat{

background:#1e293b;

padding:25px;

border-radius:15px;

text-align:center;

}




.stat h2{

font-size:40px;

color:#22c55e;

}





.action{

background:#22c55e;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

}





</style>

</head>




<body>






<div class="sidebar">



<div class="logo">

💪 FitZone

</div>




<button onclick="showPage('dashboard')">

🏠 Dashboard

</button>




<button onclick="showPage('workouts')">

💪 Workouts

</button>





<button onclick="showPage('leaderboard')">

🏆 Leaderboard

</button>





<button onclick="showPage('profile')">

👤 Profile

</button>




<button onclick="logout()">

🚪 Logout

</button>




</div>









<div class="main">







<div id="dashboard" class="page">



<h1>

<b>Are You Ready? 💪🔥</b>

</h1>



<h2>

Welcome <span id="username">User</span> 👋

</h2>








<div class="stats">





<div class="stat">

<h2>⭐</h2>

<p>XP</p>

<h3 id="xp">

0 XP

</h3>

</div>






<div class="stat">

<h2>🏅</h2>

<p>Level</p>

<h3 id="level">

Level 1

</h3>

</div>






<div class="stat">

<h2>🏆</h2>

<p>Awards</p>

<h3 id="awards">

0 Badges

</h3>

</div>






<div class="stat">

<h2>🔥</h2>

<p>Streak</p>

<h3>

0 Days

</h3>

</div>





</div>








<div class="card">


<h2>📏 Height</h2>


<p id="userHeight">

Not set

</p>


</div>







<div class="card">


<h2>⚖️ Weight</h2>


<p id="userWeight">

Not set

</p>


</div>







</div>
