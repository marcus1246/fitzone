<!DOCTYPE html>
<html>
<head>

<title>FitZone</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
background:#0f172a;
color:white;
height:100vh;
}


/* SIDEBAR */

.sidebar{

width:250px;
background:#111827;
padding:20px;

}


.logo{

font-size:28px;
font-weight:bold;
color:#22c55e;
text-align:center;
margin-bottom:35px;

}


.sidebar button{

width:100%;
padding:15px;
margin:8px 0;

background:none;
border:none;

color:white;

font-size:16px;

cursor:pointer;

border-radius:10px;

}


.sidebar button:hover{

background:#22c55e;

}


/* MAIN */

.main{

flex:1;
padding:30px;
overflow:auto;

}


.page{

display:none;

}


#dashboard{

display:block;

}



.card{

background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:20px;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-top:20px;

}


.stat{

background:#1e293b;

padding:20px;

border-radius:15px;

text-align:center;

}


.stat h2{

font-size:35px;
color:#22c55e;

}



button.action{

background:#22c55e;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

margin-top:15px;

}



.workout-box{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:15px;

}


.workout-card{

background:#334155;

padding:20px;

border-radius:15px;

}



</style>

</head>


<body>


<div class="sidebar">

<div class="logo">
💪 FitZone
</div>


<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>


<button onclick="showPage('workouts')">
💪 Workouts
</button>


<button onclick="showPage('progress')">
📈 Progress
</button>


<button onclick="showPage('nutrition')">
🥗 Nutrition
</button>


<button onclick="showPage('ai')">
🤖 AI Coach
</button>


<button onclick="showPage('profile')">
👤 Profile
</button>


<button onclick="logout()">
🚪 Logout
</button>


</div>



<div class="main">



<div id="dashboard" class="page">


<h1>Welcome Back Athlete 👋</h1>



<div class="stats">


<div class="stat">
<h2>🔥</h2>
<p>7 Day Streak</p>
</div>


<div class="stat">
<h2>💪</h2>
<p>24 Workouts</p>
</div>


<div class="stat">
<h2>⚡</h2>
<p>8450 Calories</p>
</div>


</div>




<div class="card">


<h2>🏋️ Today's Workout</h2>

<p>Chest & Triceps</p>


<button class="action" onclick="showPage('workouts')">

Start Workout

</button>


</div>





<div class="card">

<h2>⭐ Recommended Workouts</h2>


<div class="workout-box">


<div class="workout-card">

💪 Muscle Building

</div>


<div class="workout-card">

🔥 Fat Loss

</div>


<div class="workout-card">

🟢 Beginner

</div>


<div class="workout-card">

🏠 Home Workout

</div>


</div>


</div>


</div>
