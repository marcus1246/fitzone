<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
background:#0f172a;
color:white;
}

/* Sidebar */

.sidebar{
width:240px;
background:#111827;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:28px;
font-weight:bold;
color:#22c55e;
text-align:center;
margin-bottom:40px;
}

.sidebar button{
background:none;
border:none;
color:white;
padding:15px;
font-size:17px;
text-align:left;
cursor:pointer;
border-radius:10px;
margin-bottom:10px;
transition:.3s;
}

.sidebar button:hover{
background:#22c55e;
}

/* Main Content */

.main{
flex:1;
padding:40px;
overflow:auto;
}

.page{
display:none;
}

#dashboard{
display:block;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 0 15px rgba(0,0,0,.3);
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
💪 FitZone
</div>

<button onclick="showPage('dashboard')">🏠 Dashboard</button>

<button onclick="showPage('workouts')">💪 Workouts</button>

<button onclick="showPage('progress')">📈 Progress</button>

<button onclick="showPage('nutrition')">🥗 Nutrition</button>

<button onclick="showPage('ai')">🤖 AI Coach</button>

<button onclick="showPage('profile')">👤 Profile</button>

<button onclick="logout()">🚪 Logout</button>

</div>

<div class="main">

<div id="dashboard" class="page">

<h1>Welcome Back! 👋</h1>

<div class="card">
<h2>🔥 Workout Streak</h2>
<p>7 Days</p>
</div>

<div class="card">
<h2>🏋️ Today's Workout</h2>
<p>Chest & Triceps</p>
</div>

<div class="card">
<h2>🥗 Calories</h2>
<p>1850 / 2300 kcal</p>
</div>

</div>

<div id="workouts" class="page">
<h1>💪 Workouts</h1>
</div>

<div id="progress" class="page">
<h1>📈 Progress</h1>
</div>

<div id="nutrition" class="page">
<h1>🥗 Nutrition</h1>
</div>

<div id="ai" class="page">
<h1>🤖 AI Coach</h1>
</div>

<div id="profile" class="page">
<h1>👤 Profile</h1>
</div>

</div>

<script>

function showPage(page){

let pages=document.querySelectorAll(".page");

pages.forEach(function(p){
p.style.display="none";
});

document.getElementById(page).style.display="block";

}

function logout(){

localStorage.removeItem("loggedIn");

window.location.href="login.html";

}

</script>

</body>
</html>
