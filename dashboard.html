<!DOCTYPE html>
<html>
<head>

<title>FitZone Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
background:#0f172a;
color:white;
height:100vh;
}


/* SIDEBAR */

.sidebar{

width:250px;
background:#111827;
padding:20px;

}


.logo{

font-size:28px;
font-weight:bold;
color:#22c55e;
text-align:center;
margin-bottom:30px;

}


.sidebar button{

width:100%;
padding:15px;
margin:8px 0;

background:none;
border:none;

color:white;

font-size:16px;

text-align:left;

cursor:pointer;

border-radius:10px;

}


.sidebar button:hover{

background:#22c55e;

}



/* CONTENT */

.main{

flex:1;
padding:30px;
overflow:auto;

}


.page{

display:none;

}


#dashboard{

display:block;

}



.card{

background:#1e293b;

padding:20px;

border-radius:15px;

margin-top:20px;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-top:20px;

}


.stat{

background:#1e293b;

padding:20px;

border-radius:15px;

text-align:center;

}


.stat h2{

font-size:35px;

color:#22c55e;

}




button{

background:#22c55e;

color:white;

border:none;

padding:12px;

border-radius:10px;

cursor:pointer;

margin-top:10px;

}



select{

width:100%;

padding:12px;

border-radius:10px;

font-size:16px;

}



#timer{

font-size:60px;

color:#22c55e;

text-align:center;

margin:20px;

}


</style>

</head>


<body>



<div class="sidebar">


<div class="logo">

💪 FitZone

</div>


<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>


<button onclick="showPage('workouts')">
💪 Workouts
</button>


<button onclick="showPage('progress')">
📈 Progress
</button>


<button onclick="showPage('nutrition')">
🥗 Nutrition
</button>


<button onclick="showPage('ai')">
🤖 AI Coach
</button>


<button onclick="showPage('profile')">
👤 Profile
</button>


<button onclick="logout()">
🚪 Logout
</button>


</div>





<div class="main">



<div id="dashboard" class="page">


<h1>Welcome Back Athlete 👋</h1>


<div class="stats">


<div class="stat">
<h2>🔥</h2>
<p>7 Day Streak</p>
</div>


<div class="stat">
<h2>💪</h2>
<p>24 Workouts</p>
</div>


<div class="stat">
<h2>⚡</h2>
<p>8450 Calories</p>
</div>


</div>


</div>







<div id="workouts" class="page">


<h1>💪 Workout Center</h1>


<div class="card">


<h2>Select Workout</h2>


<select id="workout" onchange="chooseWorkout()">



<option value="">
Choose
</option>


<option value="chest">
💪 Chest Day
</option>


<option value="legs">
🦵 Leg Day
</option>


<option value="fatloss">
🔥 Fat Loss
</option>


<option value="beginner">
🟢 Beginner
</option>



</select>


</div>




<div class="card" id="exerciseArea" style="display:none;">


<h2 id="title"></h2>


<h3 id="exercise"></h3>


<p id="details"></p>


<div id="timer">
60
</div>


<button onclick="startTimer()">
▶ Start
</button>


<button onclick="nextExercise()">
➡ Next
</button>


</div>



</div>







<div id="progress" class="page">

<h1>📈 Progress</h1>

<div class="card">

<p>Workouts Completed: 24</p>

<p>Level: Beginner</p>

</div>

</div>







<div id="nutrition" class="page">

<h1>🥗 Nutrition</h1>

<div class="card">

<p>Calories: 1850 / 2300</p>

</div>

</div>







<div id="ai" class="page">

<h1>🤖 AI Coach</h1>

<div class="card">

<p>Your AI trainer is coming soon!</p>

</div>

</div>







<div id="profile" class="page">

<h1>👤 Profile</h1>

<div class="card">

<p>Fitness Goal: Build Muscle</p>

</div>

</div>



</div>








<script>


function showPage(page){


document.querySelectorAll(".page").forEach(function(x){

x.style.display="none";

});


document.getElementById(page).style.display="block";


}



let workouts={


chest:[

["Push Ups","3 sets x 12 reps",60],

["Bench Press","4 sets x 10 reps",90],

["Chest Fly","3 sets x 12 reps",60]

],


legs:[

["Squats","3 sets x 15 reps",90],

["Lunges","3 sets x 12 reps",60],

["Calf Raises","3 sets x 20 reps",60]

],


fatloss:[

["Jumping Jacks","45 seconds",45],

["Burpees","30 seconds",30],

["Mountain Climbers","45 seconds",45]

],


beginner:[

["Push Ups","10 reps",60],

["Squats","15 reps",60],

["Plank","30 seconds",30]

]


};



let current=[];

let index=0;

let time=60;

let timer;



function chooseWorkout(){


let choice=document.getElementById("workout").value;


current=workouts[choice];


index=0;


document.getElementById("exerciseArea").style.display="block";


showExercise();


}



function showExercise(){


let e=current[index];


document.getElementById("exercise").innerHTML=e[0];


document.getElementById("details").innerHTML=e[1];


time=e[2];


document.getElementById("timer").innerHTML=time;


}



function startTimer(){


clearInterval(timer);


timer=setInterval(function(){


time--;


document.getElementById("timer").innerHTML=time;


if(time<=0){

clearInterval(timer);

alert("Exercise Complete 🔥");

}


},1000);


}




function nextExercise(){


index++;


if(index>=current.length){

alert("Workout Finished 🏆");

return;

}


showExercise();


}



function logout(){

window.location.href="login.html";

}



</script>


</body>
</html>
