<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

h1{
color:#22c55e;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

.card h2{
color:#22c55e;
margin-bottom:10px;
}

button{
margin-top:20px;
padding:12px 20px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#16a34a;
}
</style>
</head>

<body>

<h1>💪 Welcome to FitZone!</h1>

<p>You're logged in successfully.</p>

<div class="grid">

<div class="card">
<h2>🔥 Today's Workout</h2>
<p>Chest & Triceps</p>
</div>

<div class="card">
<h2>📊 Progress</h2>
<p>Workout Streak: 7 Days</p>
</div>

<div class="card">
<h2>🥗 Nutrition</h2>
<p>Calories: 1850 / 2300</p>
</div>

<div class="card">
<h2>🤖 AI Coach</h2>
<p>Create your perfect workout plan.</p>
</div>

</div>

<button onclick="logout()">Logout</button>

<script>
function logout(){
localStorage.removeItem("loggedIn");
window.location.href="login.html";
}
</script>

</body>
</html>
