<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FitZone Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f172a;

color:white;

display:flex;

height:100vh;

overflow:hidden;

}

/* ===== Sidebar ===== */

.sidebar{

width:250px;

background:#111827;

padding:25px;

display:flex;

flex-direction:column;

}

.logo{

font-size:34px;

font-weight:bold;

text-align:center;

color:#22c55e;

margin-bottom:40px;

}

.sidebar button{

background:none;

border:none;

color:white;

font-size:17px;

padding:15px;

margin:5px 0;

border-radius:10px;

cursor:pointer;

text-align:left;

transition:.3s;

}

.sidebar button:hover{

background:#22c55e;

}

/* ===== Main ===== */

.main{

flex:1;

overflow-y:auto;

padding:35px;

background:#0f172a;

}

.page{

display:none;

}

#dashboard{

display:block;

}

/* ===== Cards ===== */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:25px;

}

.card{

background:#1e293b;

padding:20px;

border-radius:18px;

box-shadow:0 0 15px rgba(0,0,0,.25);

}

.card h2{

color:#22c55e;

margin-bottom:10px;

}

.card h1{

font-size:34px;

margin-top:10px;

}

.action{

margin-top:15px;

padding:14px;

width:100%;

border:none;

border-radius:10px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

}

.action:hover{

background:#16a34a;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

💪 FITZONE

</div>

<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>

<button onclick="showPage('workouts')">
💪 Workouts
</button>

<button onclick="showPage('leaderboard')">
🏆 Leaderboard
</button>

<button onclick="showPage('awards')">
🏅 Awards
</button>

<button onclick="showPage('profile')">
👤 Profile
</button>

<button onclick="showPage('settings')">
⚙️ Settings
</button>

<button onclick="logout()">
🚪 Logout
</button>

</div>

<div class="main">

<div id="dashboard" class="page">

<h1>

Welcome,

<span id="username">

User

</span>

👋

</h1>

<br>

<div class="cards">

<div class="card">

<h2>⭐ XP</h2>

<h1 id="xp">

0

</h1>

</div>

<div class="card">

<h2>🏅 Level</h2>

<h1 id="level">

1

</h1>

</div>

<div class="card">

<h2>🔥 Streak</h2>

<h1 id="streak">

0 Days

</h1>

</div>

<div class="card">

<h2>🏆 Badges</h2>

<h1 id="badges">

0

</h1>

</div>

</div>
