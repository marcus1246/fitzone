<!DOCTYPE html>
<html>

<head>

<title>FitZone</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
display:flex;
height:100vh;
background:#0f172a;
color:white;
}



/* SIDEBAR */

.sidebar{

width:250px;
background:#111827;
padding:20px;

}


.logo{

font-size:30px;
font-weight:bold;
color:#22c55e;
text-align:center;
margin-bottom:35px;

}



.sidebar button{

width:100%;
padding:15px;

margin:7px 0;

background:none;

border:none;

color:white;

font-size:16px;

text-align:left;

cursor:pointer;

border-radius:10px;

}



.sidebar button:hover{

background:#22c55e;

}





.main{

flex:1;
padding:30px;
overflow:auto;

}



.page{

display:none;

}


#dashboard{

display:block;

}





.card{

background:#1e293b;

padding:20px;

border-radius:15px;

margin-top:20px;

}





.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-top:20px;

}





.stat{

background:#1e293b;

padding:25px;

border-radius:15px;

text-align:center;

}




.stat h2{

font-size:40px;

color:#22c55e;

}





.action{

background:#22c55e;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

margin-top:15px;

}





.workout-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}





.workout-card{

background:#334155;

padding:20px;

border-radius:15px;

text-align:center;

}




.workout-image{

height:120px;

background:#020617;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

margin-bottom:15px;

}




#timer{

font-size:60px;

color:#22c55e;

text-align:center;

margin:20px;

}



</style>

</head>



<body>



<div class="sidebar">



<div class="logo">

💪 FitZone

</div>



<button onclick="showPage('dashboard')">

🏠 Dashboard

</button>


<button onclick="showPage('workouts')">

💪 Workouts

</button>


<button onclick="showPage('progress')">

📈 Progress

</button>


<button onclick="showPage('nutrition')">

🥗 Nutrition

</button>


<button onclick="showPage('ai')">

🤖 AI Coach

</button>


<button onclick="showPage('profile')">

👤 Profile

</button>


<button onclick="logout()">

🚪 Logout

</button>


</div>





<div class="main">



<div id="dashboard" class="page">



<h1><b>Are You Ready? 💪🔥</b></h1>




<div class="stats">



<div class="stat">

<h2>🔥</h2>

<p>Workout Streak</p>

<h3>7 Days</h3>

</div>





<div class="stat">

<h2>🏆</h2>

<p>Awards</p>

<h3>3 Badges</h3>

</div>





<div class="stat">

<h2>📏</h2>

<p>Height</p>

<h3>175 cm</h3>

</div>





<div class="stat">

<h2>⚖️</h2>

<p>Weight</p>

<h3>70 kg</h3>

</div>



</div>





<div class="card">

<h2>📈 Progress</h2>

<p>Level 1 Beginner</p>

</div>



</div>
