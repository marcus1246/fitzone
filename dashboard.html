<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FitZone Dashboard</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}

body{

background:#0f172a;

color:white;

display:flex;

min-height:100vh;

overflow:hidden;

}

.sidebar{

width:250px;

background:#111827;

padding:25px;

display:flex;

flex-direction:column;

}

.logo{

font-size:32px;

font-weight:bold;

text-align:center;

color:#22c55e;

margin-bottom:40px;

}

.sidebar button{

background:none;

border:none;

color:white;

padding:16px;

margin:6px 0;

font-size:17px;

cursor:pointer;

border-radius:12px;

text-align:left;

transition:.3s;

}

.sidebar button:hover{

background:#22c55e;

}

.main{

flex:1;

overflow-y:auto;

padding:35px;

background:#0f172a;

}

.page{

display:none;

animation:fade .4s;

}

#dashboard{

display:block;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:25px;

}

.card{

background:#1e293b;

padding:22px;

border-radius:18px;

box-shadow:0 0 12px rgba(0,0,0,.25);

}

.card h2{

color:#22c55e;

margin-bottom:10px;

}

.stat{

font-size:32px;

font-weight:bold;

}

.action{

background:#22c55e;

border:none;

color:white;

padding:14px 22px;

border-radius:12px;

cursor:pointer;

font-size:16px;

margin-top:15px;

}

.action:hover{

background:#16a34a;

}
