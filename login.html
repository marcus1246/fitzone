<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitZone - Login</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0f172a,#1e293b);

}



.container{

width:360px;

background:#1f2937;

padding:35px;

border-radius:15px;

box-shadow:0 0 20px rgba(34,197,94,.4);

}



h1{

text-align:center;

color:#22c55e;

margin-bottom:25px;

}



input{

width:100%;

padding:14px;

margin:10px 0;

border:none;

border-radius:8px;

font-size:16px;

}





button{

width:100%;

padding:14px;

background:#22c55e;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}




button:hover{

background:#16a34a;

}



p{

color:white;

text-align:center;

margin-top:20px;

}



a{

color:#22c55e;

font-weight:bold;

text-decoration:none;

}


</style>


</head>






<body>



<div class="container">



<h1>Welcome Back 💪</h1>



<input 
type="email"
id="email"
placeholder="Email">



<input 
type="password"
id="password"
placeholder="Password">





<button onclick="login()">

Login

</button>





<p>

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</p>




</div>







<script>


function login(){



let savedUser = JSON.parse(

localStorage.getItem("fitUser")

);





let email = document.getElementById("email").value;


let password = document.getElementById("password").value;





if(!savedUser){


alert("No account found. Please sign up first.");

return;


}





if(

email === savedUser.email &&

password === savedUser.password

){



localStorage.setItem(

"currentUser",

JSON.stringify(savedUser)

);




alert("Login successful! 🔥");



window.location.href="dashboard.html";



}

else{


alert("Incorrect email or password ❌");


}




}



</script>



</body>

</html>
