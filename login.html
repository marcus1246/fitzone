```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
width:380px;
background:#1f2937;
padding:35px;
border-radius:18px;
box-shadow:0 0 20px rgba(34,197,94,.4);
}

h1{
text-align:center;
color:#22c55e;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#16a34a;
}

p{
margin-top:20px;
text-align:center;
color:white;
}

a{
color:#22c55e;
text-decoration:none;
font-weight:bold;
}

.error{
color:#ef4444;
text-align:center;
margin-top:15px;
display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>🔐 Login</h1>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

<p class="error" id="error">

Invalid email or password.

</p>

<p>

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

<script>

function login(){

let email=document.getElementById("email").value.trim();

let password=document.getElementById("password").value;

let users=
JSON.parse(localStorage.getItem("users"))||[];

let user=users.find(function(u){

return u.email===email &&
u.password===password;

});

if(user){

localStorage.setItem(
"currentUser",
JSON.stringify(user)
);

window.location.href="dashboard.html";

}else{

document.getElementById("error").style.display="block";

}

}

</script>

</body>
</html>
```
